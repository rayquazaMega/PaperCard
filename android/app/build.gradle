apply plugin: 'com.android.application'

def paperCardRoot = rootProject.projectDir.parentFile
def loadDotEnv = {
    def result = new Properties()
    def envFile = new File(paperCardRoot, '.env')
    if (envFile.exists()) {
        envFile.eachLine('UTF-8') { line ->
            def clean = line.trim()
            if (clean && !clean.startsWith('#') && clean.contains('=')) {
                def index = clean.indexOf('=')
                result.setProperty(clean.substring(0, index).trim(), clean.substring(index + 1).trim())
            }
        }
    }
    return result
}
def dotEnv = loadDotEnv()
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def localValue = { name, fallback ->
    return localProps.getProperty(name) ?: dotEnv.getProperty(name) ?: System.getenv(name) ?: fallback
}
def quoted = { value ->
    return '"' + String.valueOf(value ?: '').replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace = "com.papercard.reader"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.papercard.reader"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "DEFAULT_AGNES_API_KEY", quoted(localValue('AGNES_API_KEY', ''))
        buildConfigField "String", "DEFAULT_AGNES_API_URL", quoted(localValue('AGNES_API_URL', 'https://apihub.agnes-ai.com/v1/chat/completions'))
        buildConfigField "String", "DEFAULT_AGNES_MODEL", quoted(localValue('AGNES_MODEL', 'agnes-2.0-flash'))
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
